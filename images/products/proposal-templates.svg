<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">

<defs>
  <filter id="rough1" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.045 0.06" numOctaves="2" seed="3" result="n1"/>
    <feDisplacementMap in="SourceGraphic" in2="n1" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05 0.04" numOctaves="2" seed="11" result="n2"/>
    <feDisplacementMap in="SourceGraphic" in2="n2" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="rough3" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04 0.05" numOctaves="2" seed="27" result="n3"/>
    <feDisplacementMap in="SourceGraphic" in2="n3" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="rough4" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055 0.045" numOctaves="2" seed="42" result="n4"/>
    <feDisplacementMap in="SourceGraphic" in2="n4" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
  </filter>
  <style>
    .hand { font-family: 'Comic Sans MS','Segoe Print','Bradley Hand',cursive,sans-serif; }
  </style>
</defs>

<linearGradient id="grainfill" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#FFFCF5"/>
  <stop offset="1" stop-color="#FFF8E8"/>
</linearGradient>

  <!-- shadow -->
  <rect x="10" y="14" width="462" height="278" rx="18" fill="#000000" opacity="0.16" filter="url(#softShadow)"/>
  <!-- page -->
  <rect x="2" y="2" width="466" height="284" rx="18" fill="url(#grainfill)"/>
  <rect x="2.5" y="2.5" width="465" height="283" rx="18" fill="none" stroke="#E7E1D2" stroke-width="1"/>

  <!-- spiral binder strip -->
  <rect x="2" y="2" width="34" height="284" rx="18" fill="#EFE9DA"/>
  <g fill="#ffffff" stroke="#B9B0A0" stroke-width="1.4">
    <circle cx="19" cy="22" r="6"/>
    <circle cx="19" cy="57" r="6"/>
    <circle cx="19" cy="92" r="6"/>
    <circle cx="19" cy="127" r="6"/>
    <circle cx="19" cy="162" r="6"/>
    <circle cx="19" cy="197" r="6"/>
    <circle cx="19" cy="232" r="6"/>
    <circle cx="19" cy="267" r="6"/>
  </g>

  <rect x="190" y="-4" width="46" height="16" rx="2" fill="#FDBA74" opacity="0.5" transform="rotate(-10 213 4)"/>

  <rect x="46" y="18" width="122" height="22" rx="11" fill="#EDE6FB"/>
  <text x="107.0" y="33" text-anchor="middle" class="hand" font-size="11" font-weight="700" fill="#6D28D9">Notes By Rashika</text>
  <rect x="374.4" y="18" width="77.6" height="22" rx="11" fill="#EA580C"/>
  <text x="413.2" y="33" text-anchor="middle" class="hand" font-size="11" font-weight="700" fill="#ffffff">PROPOSAL</text>

  <text x="50" y="68" class="hand" font-size="20" font-weight="700" fill="#1E1B4B" transform="rotate(-0.5 50 68)">Client Proposal Templates</text>
  <path d="M50 76 Q 130 83 210 76 T 360 76" fill="none" stroke="#FB923C" stroke-width="3" stroke-linecap="round" filter="url(#rough2)"/>

  <text x="50" y="96" class="hand" font-size="11.5" fill="#64748B">Win more Odoo projects with ready docs</text>

  
  <rect x="50" y="108" width="190" height="80" rx="12" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.8" filter="url(#rough1)"/>
  <text x="60" y="130" class="hand" font-size="12" font-weight="700" fill="#C2410C">1. Scope of Work</text>
  <text x="60" y="152" class="hand" font-size="10" fill="#334155">✓ Deliverables List</text>
  <text x="60" y="168" class="hand" font-size="10" fill="#334155">✓ Project Boundaries</text>
  
  <rect x="250" y="108" width="190" height="80" rx="12" fill="#FEF9C3" stroke="#FACC15" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="130" class="hand" font-size="12" font-weight="700" fill="#A16207">2. Pricing Sheet</text>
  <text x="260" y="152" class="hand" font-size="10" fill="#334155">✓ Module-wise Pricing</text>
  <text x="260" y="168" class="hand" font-size="10" fill="#334155">✓ Optional Add-ons</text>
  
  <rect x="50" y="198" width="190" height="80" rx="12" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.8" filter="url(#rough3)"/>
  <text x="60" y="220" class="hand" font-size="12" font-weight="700" fill="#1D4ED8">3. Timeline</text>
  <text x="60" y="242" class="hand" font-size="10" fill="#334155">✓ Milestone Plan</text>
  <text x="60" y="258" class="hand" font-size="10" fill="#334155">✓ Go-Live Dates</text>
  
  <rect x="250" y="198" width="190" height="80" rx="12" fill="#FDF2F8" stroke="#F472B6" stroke-width="1.8" filter="url(#rough4)"/>
  <text x="260" y="220" class="hand" font-size="12" font-weight="700" fill="#BE185D">4. Terms</text>
  <text x="260" y="242" class="hand" font-size="10" fill="#334155">✓ Payment Terms</text>
  <text x="260" y="258" class="hand" font-size="10" fill="#334155">✓ Support Terms</text>
  
  
  <circle cx="446" cy="58" r="16" fill="#FED7AA" filter="url(#rough4)"/>
  <text x="446" y="64" text-anchor="middle" font-size="16">📄</text>
</svg>
